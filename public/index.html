<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Produtos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo">
    <div class="topo-conteudo">
      <p class="topo-marca">Nº registro de estoque</p>
      <h1>Catálogo de Produtos</h1>
    </div>
    <div class="topo-contagem">
      <span id="contagemProdutos">0</span>
      <p>itens no estoque</p>
    </div>
  </header>

  <main class="container">

    <section class="painel-formulario" id="painelFormulario">
      <div class="painel-cabecalho">
        <h2 id="tituloFormulario">Novo produto</h2>
        <button type="button" class="botao-texto" id="botaoCancelar" hidden>Cancelar edição</button>
      </div>

      <form id="formProduto" novalidate>
        <input type="hidden" id="produtoId">

        <div class="campo">
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" name="descricao" placeholder="Ex.: Teclado Mecânico" required>
        </div>

        <div class="campo campo-curto">
          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" name="preco" min="0" step="0.01" placeholder="0,00" required>
        </div>

        <div class="campo">
          <label for="categoria">Categoria</label>
          <input type="text" id="categoria" name="categoria" placeholder="Ex.: Periféricos" required>
        </div>

        <div class="campo campo-curto">
          <label for="estoque">Estoque</label>
          <input type="number" id="estoque" name="estoque" min="0" step="1" placeholder="0" required>
        </div>

        <div class="campo campo-acao">
          <button type="submit" id="botaoSalvar">Cadastrar produto</button>
        </div>
      </form>

      <p class="mensagem" id="mensagem" role="status" hidden></p>
    </section>

    <section class="painel-lista">
      <table class="tabela-produtos">
        <thead>
          <tr>
            <th class="col-id">ID</th>
            <th>Descrição</th>
            <th class="col-preco">Preço</th>
            <th>Categoria</th>
            <th class="col-estoque">Estoque</th>
            <th class="col-acoes">Ações</th>
          </tr>
        </thead>
        <tbody id="corpoTabela">
          <!-- Linhas inseridas via JavaScript -->
        </tbody>
      </table>

      <p class="estado-vazio" id="estadoVazio" hidden>Nenhum produto cadastrado ainda. Use o formulário acima para adicionar o primeiro.</p>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
